name: CI/CD Pipeline

on:
    push:
        branches: ["main"]
        # FinOps (pendiente): cada push a main construye y publica una imagen,
        # incluso si solo cambian docs o evidencias. Una vez estabilizado el
        # pipeline, agregar `paths-ignore: ["evidencias/**", "**.md"]` acá
        # para no gastar minutos de runner ni almacenamiento en el registry.
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app/
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  package_json_file: app/package.json
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: app/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm test

    build-and-push:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{github.repository}}
        steps:
            - uses: actions/checkout@v7
            - uses: docker/login-action@v4
              with:
                  registry: ${{env.REGISTRY}}
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}
                  tags: type=sha
            - uses: docker/build-push-action@v7
              with:
                  context: ./app
                  push: true
                  tags: ${{steps.meta.outputs.tags}}
                  labels: ${{steps.meta.outputs.labels}}
