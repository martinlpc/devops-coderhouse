apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'devops-pf-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devops-pf

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: devops-pf-api

          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "3000"

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']